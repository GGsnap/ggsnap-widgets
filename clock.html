<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Clock Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Bitter:ital,wght@0,600;1,600&family=Cabin:wght@600&family=Cairo:wght@600&family=Catamaran:wght@600&family=Cinzel:wght@600&family=Comfortaa:wght@600&family=Cormorant+Garamond:wght@600&family=Crimson+Text:wght@600&family=Dosis:wght@600&family=Exo+2:wght@600&family=Fira+Sans:wght@600&family=Heebo:wght@600&family=Inconsolata:wght@600&family=Inter:wght@600&family=Josefin+Sans:wght@600&family=Kanit:wght@600&family=Lato:wght@700&family=Libre+Baskerville:wght@700&family=Lobster&family=Lora:wght@600&family=Montserrat:wght@600&family=Mulish:wght@600&family=Noto+Sans:wght@600&family=Nunito:wght@600&family=Open+Sans:wght@600&family=Oswald:wght@600&family=Oxygen:wght@700&family=Pacifico&family=Playfair+Display:wght@600&family=Poppins:wght@600&family=Press+Start+2P&family=Prompt:wght@600&family=Quicksand:wght@600&family=Raleway:wght@600&family=Righteous&family=Roboto:wght@700&family=Roboto+Condensed:wght@700&family=Russo+One&family=Secular+One&family=Signika:wght@600&family=Source+Sans+Pro:wght@600&family=Space+Grotesk:wght@600&family=Titillium+Web:wght@600&family=Ubuntu:wght@700&family=Varela+Round&family=Work+Sans:wght@600&family=Yanone+Kaffeesatz:wght@600&family=Orbitron:wght@700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            color: #f4f4f5;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .page-layout {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            width: fit-content;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            gap: 20px;
            background: #09090b;
            padding: 20px;
            border-radius: 16px;
        }

        /* Config Panel Styling (Pinned Left) */
        .config-panel {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 20px;
            width: 280px;
            flex-shrink: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
            color: #f4f4f5;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-height: 90vh;
            overflow-y: auto;
        }

        .config-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #38bdf8;
            border-bottom: 1px solid #27272a;
            padding-bottom: 8px;
        }

        .config-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .config-row {
            display: flex;
            gap: 10px;
        }

        .config-row .config-group {
            flex: 1;
        }

        .config-panel label {
            font-size: 11px;
            color: #a1a1aa;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
        }

        .config-panel input, .config-panel select {
            background: #09090b;
            border: 1px solid #3f3f46;
            border-radius: 6px;
            color: #ffffff;
            padding: 6px 10px;
            font-size: 12px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        .config-panel input[type="color"] {
            padding: 2px 6px;
            height: 32px;
            cursor: pointer;
        }

        .config-panel input[type="range"] {
            padding: 0;
            cursor: pointer;
        }

        .config-panel input:focus, .config-panel select:focus {
            border-color: #38bdf8;
        }

        .obs-group {
            border-top: 1px solid #27272a;
            padding-top: 10px;
            margin-top: 4px;
        }

        .obs-url-row {
            display: flex;
            gap: 6px;
        }

        .obs-url-row input {
            background: #000000;
            color: #38bdf8;
            font-family: monospace;
            font-size: 11px;
        }

        .obs-url-row button {
            background: #38bdf8;
            color: #09090b;
            border: none;
            border-radius: 6px;
            padding: 0 12px;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .obs-url-row button:hover {
            background: #0ea5e9;
        }

        /* Preview Viewport Container */
        .preview-viewport {
            flex-grow: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 40px;
            box-sizing: border-box;
            height: 100%;
            background: radial-gradient(circle at center, #18181b 0%, #0c0c0e 100%);
            border: 1px solid #27272a;
            border-radius: 12px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
        }

        /* OBS Mode Switch */
        body.obs-mode {
            background: transparent !important;
        }
        body.obs-mode .page-layout {
            display: none !important;
        }
        body.obs-mode .obs-standalone-clock {
            display: flex !important;
        }

        /* Standalone OBS Clock Widget Styling */
        .obs-standalone-clock {
            display: none;
            flex-direction: column;
            align-items: var(--textAlign, center);
            gap: 10px;
            padding: 10px;
            background: transparent;
            width: fit-content;
            height: fit-content;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.6));
        }

        .clock-container {
            display: flex;
            flex-direction: column;
            align-items: var(--textAlign, center);
            gap: 10px;
            padding: 10px;
            background: transparent;
            width: fit-content;
            height: fit-content;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.6));
        }

        .clock-section {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
            width: 100%;
        }

        #topSection, #obsTopSection {
            font-family: 'Poppins', sans-serif;
            font-size: var(--topFontSize, 32px);
        }

        #bottomSection, #obsBottomSection {
            font-family: 'Poppins', sans-serif;
            font-size: var(--bottomFontSize, 24px);
            opacity: var(--bottomOpacity, 1);
        }

        .clock-item-wrapper {
            position: relative;
            display: inline-block;
            line-height: 1;
        }

        .clock-outline-layer {
            font-size: 1em;
            font-weight: 600;
            letter-spacing: 0.5px;
            line-height: 1;
            color: #000000;
            text-shadow: 
                2px 2px 0px #000, 
                -2px 2px 0px #000, 
                2px -2px 0px #000, 
                -2px -2px 0px #000, 
                0px 2px 0px #000, 
                0px -2px 0px #000, 
                2px 0px 0px #000, 
                -2px 0px 0px #000;
        }

        .clock-gradient-layer {
            font-size: 1em;
            font-weight: 600;
            letter-spacing: 0.5px;
            line-height: 1;
            background: var(--sectionGradient, none);
            -webkit-background-clip: var(--bgClip, border-box);
            -webkit-text-fill-color: var(--textFill, #ffffff);
        }

        .no-stroke .clock-outline-layer {
            display: none;
        }

        .no-stroke .clock-gradient-layer {
            position: relative;
        }

        .has-stroke .clock-gradient-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="page-layout">
        <div class="config-panel" id="configPanel">
            <div class="config-title">Widget Settings</div>
            
            <div class="config-group">
                <label>Timezone</label>
                <select id="cfgTimezone" name="tz">
                    <option value="">Local Time</option>
                    <optgroup label="North America">
                        <option value="America/New_York">Eastern Time (US/New York)</option>
                        <option value="America/Chicago">Central Time (US/Chicago)</option>
                        <option value="America/Denver">Mountain Time (US/Denver)</option>
                        <option value="America/Los_Angeles">Pacific Time (US/Los Angeles)</option>
                        <option value="America/Anchorage">Alaska Time</option>
                        <option value="Pacific/Honolulu">Hawaii Time</option>
                        <option value="America/Toronto">Eastern Time (Canada)</option>
                        <option value="America/Vancouver">Pacific Time (Canada)</option>
                        <option value="America/Mexico_City">Mexico City</option>
                    </optgroup>
                    <optgroup label="Europe">
                        <option value="Europe/London">London (GMT/BST)</option>
                        <option value="Europe/Paris">Paris / Central European Time</option>
                        <option value="Europe/Berlin">Berlin</option>
                        <option value="Europe/Amsterdam">Amsterdam</option>
                        <option value="Europe/Rome">Rome</option>
                        <option value="Europe/Madrid">Madrid</option>
                        <option value="Europe/Athens">Athens</option>
                        <option value="Europe/Moscow">Moscow</option>
                    </optgroup>
                    <optgroup label="Asia & Pacific">
                        <option value="Asia/Tokyo">Tokyo</option>
                        <option value="Asia/Shanghai">Shanghai / Beijing</option>
                        <option value="Asia/Hong_Kong">Hong Kong</option>
                        <option value="Asia/Singapore">Singapore</option>
                        <option value="Asia/Seoul">Seoul</option>
                        <option value="Asia/Dubai">Dubai</option>
                        <option value="Asia/Kolkata">India (Kolkata)</option>
                        <option value="Australia/Sydney">Sydney</option>
                        <option value="Australia/Melbourne">Melbourne</option>
                        <option value="Pacific/Auckland">Auckland</option>
                    </optgroup>
                    <optgroup label="South America & Africa">
                        <option value="America/Sao_Paulo">São Paulo</option>
                        <option value="America/Buenos_Aires">Buenos Aires</option>
                        <option value="Africa/Cairo">Cairo</option>
                        <option value="Africa/Johannesburg">Johannesburg</option>
                    </optgroup>
                    <optgroup label="UTC">
                        <option value="UTC">Coordinated Universal Time (UTC)</option>
                    </optgroup>
                </select>
            </div>

            <div class="config-row">
                <div class="config-group">
                    <label>Format</label>
                    <select id="cfgUse12Hour" name="h12">
                        <option value="true">12-Hour</option>
                        <option value="false">24-Hour</option>
                    </select>
                </div>
                <div class="config-group">
                    <label>Seconds</label>
                    <select id="cfgShowSeconds" name="sec">
                        <option value="false">Hidden</option>
                        <option value="true">Visible</option>
                    </select>
                </div>
            </div>

            <div class="config-group">
                <label>Alignment</label>
                <select id="cfgTextAlign" name="align">
                    <option value="center">Center</option>
                    <option value="flex-start">Left</option>
                    <option value="flex-end">Right</option>
                </select>
            </div>

            <div class="config-group">
                <label>Top Slots (comma separated)</label>
                <input type="text" id="cfgTopSlots" name="top" value="time">
            </div>

            <div class="config-group">
                <label>Bottom Slots (comma separated)</label>
                <input type="text" id="cfgBottomSlots" name="bot" value="mm, dd, yyyy">
            </div>

            <div class="config-group">
                <label>Top Font Size</label>
                <input type="number" id="cfgTopFontSize" name="tsize" value="32">
            </div>
            <div class="config-group">
                <label>Bottom Font Size</label>
                <input type="number" id="cfgBottomFontSize" name="bsize" value="24">
            </div>

            <div class="config-group">
                <label>Bottom Row Opacity <span id="opacityValLabel">1.0</span></label>
                <input type="range" id="cfgBottomOpacity" name="bop" min="0" max="1" step="0.05" value="1">
            </div>

            <div class="config-row">
                <div class="config-group">
                    <label>Text Outline</label>
                    <select id="cfgEnableStroke" name="stroke">
                        <option value="true">Enabled</option>
                        <option value="false">Disabled</option>
                    </select>
                </div>
                <div class="config-group">
                    <label>Gradient Fill</label>
                    <select id="cfgEnableGradient" name="grad">
                        <option value="false">Disabled</option>
                        <option value="true">Enabled</option>
                    </select>
                </div>
            </div>

            <div class="config-row">
                <div class="config-group">
                    <label>Gradient Start Color</label>
                    <input type="color" id="cfgGradientStart" name="gstart" value="#ffffff">
                </div>
                <div class="config-group">
                    <label>Gradient End Color</label>
                    <input type="color" id="cfgGradientEnd" name="gend" value="#00ffff">
                </div>
            </div>

            <div class="config-group obs-group">
                <label>OBS Browser Source URL</label>
                <div class="obs-url-row">
                    <input type="text" id="obsUrlOutput" readonly>
                    <button type="button" id="copyObsBtn" title="Copy OBS URL">Copy</button>
                </div>
            </div>
        </div>

        <div class="preview-viewport">
            <div class="clock-container" id="clockContainer">
                <div class="clock-section" id="topSection"></div>
                <div class="clock-section" id="bottomSection"></div>
            </div>
        </div>
    </div>

    <div class="obs-standalone-clock" id="obsStandaloneClock">
        <div class="clock-section" id="obsTopSection"></div>
        <div class="clock-section" id="obsBottomSection"></div>
    </div>

    <script>
        (function () {
            const topSection = document.getElementById("topSection");
            const bottomSection = document.getElementById("bottomSection");
            const obsTopSection = document.getElementById("obsTopSection");
            const obsBottomSection = document.getElementById("obsBottomSection");

            const cfgTimezone = document.getElementById("cfgTimezone");
            const cfgUse12Hour = document.getElementById("cfgUse12Hour");
            const cfgShowSeconds = document.getElementById("cfgShowSeconds");
            const cfgTextAlign = document.getElementById("cfgTextAlign");
            const cfgTopSlots = document.getElementById("cfgTopSlots");
            const cfgBottomSlots = document.getElementById("cfgBottomSlots");
            const cfgTopFontSize = document.getElementById("cfgTopFontSize");
            const cfgBottomFontSize = document.getElementById("cfgBottomFontSize");
            const cfgBottomOpacity = document.getElementById("cfgBottomOpacity");
            const opacityValLabel = document.getElementById("opacityValLabel");
            const cfgEnableStroke = document.getElementById("cfgEnableStroke");
            const cfgEnableGradient = document.getElementById("cfgEnableGradient");
            const cfgGradientStart = document.getElementById("cfgGradientStart");
            const cfgGradientEnd = document.getElementById("cfgGradientEnd");
            const obsUrlOutput = document.getElementById("obsUrlOutput");
            const copyObsBtn = document.getElementById("copyObsBtn");

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.toString().length > 0) {
                document.body.classList.add('obs-mode');
            }

            if (urlParams.has('tz')) cfgTimezone.value = urlParams.get('tz');
            if (urlParams.has('h12')) cfgUse12Hour.value = urlParams.get('h12');
            if (urlParams.has('sec')) cfgShowSeconds.value = urlParams.get('sec');
            if (urlParams.has('align')) cfgTextAlign.value = urlParams.get('align');
            if (urlParams.has('top')) cfgTopSlots.value = urlParams.get('top');
            if (urlParams.has('bot')) cfgBottomSlots.value = urlParams.get('bot');
            if (urlParams.has('tsize')) cfgTopFontSize.value = urlParams.get('tsize');
            if (urlParams.has('bsize')) cfgBottomFontSize.value = urlParams.get('bsize');
            if (urlParams.has('bop')) cfgBottomOpacity.value = urlParams.get('bop');
            if (urlParams.has('stroke')) cfgEnableStroke.value = urlParams.get('stroke');
            if (urlParams.has('grad')) cfgEnableGradient.value = urlParams.get('grad');
            if (urlParams.has('gstart')) cfgGradientStart.value = urlParams.get('gstart');
            if (urlParams.has('gend')) cfgGradientEnd.value = urlParams.get('gend');

            function getOrdinalSuffix(day) {
                if (day > 3 && day < 21) return 'th';
                switch (day % 10) {
                    case 1:  return "st";
                    case 2:  return "nd";
                    case 3:  return "rd";
                    default: return "th";
                }
            }

            function updateObsUrl() {
                const baseUrl = "https://ggsnap-widgets.vercel.app/clock.html";
                const params = new URLSearchParams();
                
                if (cfgTimezone.value) params.set('tz', cfgTimezone.value);
                params.set('h12', cfgUse12Hour.value);
                params.set('sec', cfgShowSeconds.value);
                params.set('align', cfgTextAlign.value);
                params.set('top', cfgTopSlots.value);
                params.set('bot', cfgBottomSlots.value);
                params.set('tsize', cfgTopFontSize.value);
                params.set('bsize', cfgBottomFontSize.value);
                params.set('bop', cfgBottomOpacity.value);
                params.set('stroke', cfgEnableStroke.value);
                params.set('grad', cfgEnableGradient.value);
                params.set('gstart', cfgGradientStart.value);
                params.set('gend', cfgGradientEnd.value);

                obsUrlOutput.value = baseUrl + '?' + params.toString();
            }

            function updateClock() {
                const timezone = cfgTimezone.value.trim();
                const use12Hour = cfgUse12Hour.value === "true";
                const showSeconds = cfgShowSeconds.value === "true";
                const textAlign = cfgTextAlign.value;
                const topSlots = cfgTopSlots.value.split(',').map(s => s.trim()).filter(Boolean);
                const bottomSlots = cfgBottomSlots.value.split(',').map(s => s.trim()).filter(Boolean);
                const topFontSize = cfgTopFontSize.value || 32;
                const bottomFontSize = cfgBottomFontSize.value || 24;
                const bottomOpacity = cfgBottomOpacity.value || 1;
                const enableStroke = cfgEnableStroke.value === "true";
                const enableGradient = cfgEnableGradient.value === "true";
                const gradStart = cfgGradientStart.value;
                const gradEnd = cfgGradientEnd.value;

                if (opacityValLabel) opacityValLabel.textContent = bottomOpacity;

                document.body.style.setProperty('--textAlign', textAlign);
                document.body.style.setProperty('--topFontSize', topFontSize + 'px');
                document.body.style.setProperty('--bottomFontSize', bottomFontSize + 'px');
                document.body.style.setProperty('--bottomOpacity', bottomOpacity);

                const now = new Date();
                const timeZoneSetting = timezone !== "" ? timezone : undefined;
                const optionsBase = timeZoneSetting ? { timeZone: timeZoneSetting } : {};

                const dayNumStr = now.toLocaleDateString(undefined, { ...optionsBase, day: 'numeric' });
                const dayNum = parseInt(dayNumStr, 10);
                const dateNumWithSuffix = dayNumStr + getOrdinalSuffix(dayNum);

                const elementMap = {
                    yyyy: now.toLocaleDateString(undefined, { ...optionsBase, year: 'numeric' }),
                    mm: now.toLocaleDateString(undefined, { ...optionsBase, month: 'short' }),
                    dd: dateNumWithSuffix,
                    day: now.toLocaleDateString(undefined, { ...optionsBase, weekday: 'short' }),
                    time: now.toLocaleTimeString(undefined, { 
                        ...optionsBase,
                        hour: '2-digit', 
                        minute: '2-digit', 
                        second: showSeconds ? '2-digit' : undefined, 
                        hour12: use12Hour 
                    })
                };

                populateSection(topSection, topSlots, elementMap, enableStroke, enableGradient, gradStart, gradEnd);
                populateSection(bottomSection, bottomSlots, elementMap, enableStroke, enableGradient, gradStart, gradEnd);
                
                populateSection(obsTopSection, topSlots, elementMap, enableStroke, enableGradient, gradStart, gradEnd);
                populateSection(obsBottomSection, bottomSlots, elementMap, enableStroke, enableGradient, gradStart, gradEnd);
                
                updateObsUrl();
            }

            function populateSection(sectionElement, slots, elementMap, hasStroke, enableGradient, gradStart, gradEnd) {
                if (!sectionElement) return;
                
                let gradVal = 'none';
                let clipVal = 'border-box';
                let fillVal = "#ffffff";

                if (enableGradient) {
                    gradVal = `linear-gradient(90deg, ${gradStart}, ${gradEnd})`;
                    clipVal = 'text';
                    fillVal = 'transparent';
                }

                sectionElement.style.setProperty('--sectionGradient', gradVal);
                sectionElement.style.setProperty('--bgClip', clipVal);
                sectionElement.style.setProperty('--textFill', fillVal);

                sectionElement.textContent = '';
                slots.forEach(key => {
                    if (elementMap[key]) {
                        const text = elementMap[key];

                        const wrapper = document.createElement('div');
                        wrapper.className = 'clock-item-wrapper ' + (hasStroke ? 'has-stroke' : 'no-stroke');

                        if (hasStroke) {
                            const outlineLayer = document.createElement('div');
                            outlineLayer.className = 'clock-outline-layer';
                            outlineLayer.textContent = text;
                            wrapper.appendChild(outlineLayer);
                        }

                        const gradientLayer = document.createElement('div');
                        gradientLayer.className = 'clock-gradient-layer';
                        gradientLayer.textContent = text;
                        wrapper.appendChild(gradientLayer);

                        sectionElement.appendChild(wrapper);
                    }
                });
            }

            copyObsBtn.addEventListener('click', () => {
                obsUrlOutput.select();
                navigator.clipboard.writeText(obsUrlOutput.value).then(() => {
                    const originalText = copyObsBtn.textContent;
                    copyObsBtn.textContent = 'Copied!';
                    setTimeout(() => {
                        copyObsBtn.textContent = originalText;
                    }, 1500);
                });
            });

            const inputs = document.querySelectorAll('.config-panel input, .config-panel select');
            inputs.forEach(input => {
                if (input !== obsUrlOutput) {
                    input.addEventListener('input', updateClock);
                    input.addEventListener('change', updateClock);
                }
            });

            updateClock();
            setInterval(updateClock, 1000);
        })();
    </script>
</body>
</html>
